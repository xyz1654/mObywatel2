<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mDowód</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .phone-container { width: 100%; max-width: 420px; background-color: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid var(--border); margin-top: 10px; }
        .card-body { padding: 20px; }
        .photo-section { display: flex; gap: 20px; align-items: center; }
        .photo-box { width: 110px; height: 140px; border-radius: 12px; overflow: hidden; background-color: #e5e7eb; border: 1px solid var(--border); flex-shrink: 0; }
        .photo-box img { width: 100%; height: 1005; object-fit: cover; display: block; }
        .user-names h2 { font-size: 20px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="card-body">
            <div class="photo-section">
                <div class="photo-box">
                    <!-- KLUCZOWE ID DLA ZDJĘCIA -->
                    <img id="profileImage" alt="Zdjęcie">
                </div>
                <div class="user-names">
                    <h2 id="display-name">JAN</h2>
                    <p id="display-surname">KOWALSKI</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Panel diagnostyczny na ekranie telefonu
            const savedPhoto = localStorage.getItem("profilePhoto");
            const imgEl = document.getElementById("profileImage");

            const box = document.createElement("div");
            box.style.cssText = "background: #111; color: #fff; padding: 12px; margin-bottom: 15px; border-radius: 8px; font-size: 12px; width: 100%; max-width: 420px; word-break: break-all;";
            
            if (!savedPhoto) {
                box.innerHTML = "<b>STATUS DIAGNOSTYKI:</b> Brak zdjęcia w pamięci (puste localStorage). Wgraj je ponownie w generatorze.";
            } else if (!imgEl) {
                box.innerHTML = "<b>STATUS DIAGNOSTYKI:</b> Zdjęcie jest w pamięci, ale brak znacznika z id='profileImage'!";
            } else {
                box.innerHTML = "<b>STATUS DIAGNOSTYKI:</b> Sukces! Wczytano zdjęcie z pamięci.";
                imgEl.src = savedPhoto;
            }
            document.body.prepend(box);

            // Podstawienie imienia i nazwiska
            if (localStorage.getItem("name")) {
                document.getElementById("display-name").textContent = localStorage.getItem("name");
            }
            if (localStorage.getItem("surname")) {
                document.getElementById("display-surname").textContent = localStorage.getItem("surname");
            }
        });
    </script>
</body>
</html>

    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            function generateIdSeries() {
                const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                return `${letters.charAt(Math.floor(Math.random()*26))}${letters.charAt(Math.floor(Math.random()*26))}${letters.charAt(Math.floor(Math.random()*26))} ${Math.floor(100000 + Math.random() * 899999)}`;
            }

            function generatePesel(birthDateStr, isMale) {
                if (!birthDateStr || !birthDateStr.includes(".")) birthDateStr = "15.08.2008";
                const parts = birthDateStr.split(".");
                const pad = (n) => (n < 10 ? "0" + n : "" + n);
                let pMonth = parseInt(parts[1], 10);
                if (parseInt(parts[2], 10) >= 2000) pMonth += 20;
                const raw = String(parts[2]).slice(-2) + pad(pMonth) + pad(parts[0]) + Math.floor(100 + Math.random() * 899) + (isMale ? 1 : 2);
                let sum = 0, weights = [1, 3, 7, 9, 1, 3, 7, 9, 1, 3];
                for (let i = 0; i < 10; i++) sum += parseInt(raw.charAt(i), 10) * weights[i];
                return raw + ((10 - (sum % 10)) % 10);
            }

            let birthDate = localStorage.getItem("birthDate") || "15.08.2008";
            let gender = localStorage.getItem("gender") || "MĘŻCZYZNA";
            let isMale = gender.toUpperCase().startsWith("M");
            let userSurname = localStorage.getItem("surname") || "KOWALSKI";

            if (!localStorage.getItem("pesel")) localStorage.setItem("pesel", generatePesel(birthDate, isMale));
            if (!localStorage.getItem("idSeriesMain")) localStorage.setItem("idSeriesMain", generateIdSeries());

            const fields = ["name", "surname", "nationality", "birthDate", "pesel", "idSeriesMain", "expiryDateMain", "issueDateMain", "fatherNameMain", "motherNameMain", "lastName", "gender", "fatherSurname", "motherSurname", "placeOfBirth", "address", "postalcode", "registrationDate"];
            fields.forEach(key => {
                let elId = ["name", "surname", "nationality", "birthDate", "pesel"].includes(key) ? "display-" + key : (key === "fatherNameMain" ? "fathernameMain" : (key === "motherNameMain" ? "mothernameMain" : key));
                const el = document.getElementById(elId);
                const val = localStorage.getItem(key);
                if (el && val) el.textContent = val.toUpperCase();
            });

            // Wczytywanie zdjęcia zapisanego w pamięci przeglądarki
            const savedPhoto = localStorage.getItem("profilePhoto");
            const imgEl = document.getElementById("profileImage");
            if (savedPhoto && imgEl) {
                imgEl.src = savedPhoto;
            }

            const toggleBtn = document.getElementById("extra-toggle");
            const contentDiv = document.getElementById("extra-content");
            const arrowImg = document.getElementById("extra-arrow");
            if (toggleBtn && contentDiv) {
                toggleBtn.addEventListener("click", function () {
                    const isOpen = contentDiv.style.display === "block";
                    contentDiv.style.display = isOpen ? "none" : "block";
                    if (arrowImg) arrowImg.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
                });
            }

            const lastUpdateEl = document.getElementById("lastUpdateData");
            const btnUpdate = document.getElementById("aktualizuj");
            const setNowDate = () => {
                const d = new Date();
                const pad = (n) => (n < 10 ? "0" + n : "" + n);
                return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
            };
            if (lastUpdateEl) lastUpdateEl.textContent = localStorage.getItem("lastUpdateDate") || setNowDate();
            if (btnUpdate) {
                btnUpdate.addEventListener("click", function (e) {
                    e.preventDefault();
                    const now = setNowDate();
                    if (lastUpdateEl) lastUpdateEl.textContent = now;
                    localStorage.setItem("lastUpdateDate", now);
                });
            }
        });

        const czasEl = document.getElementById("clock");
        setInterval(() => {
            if (czasEl) {
                const now = new Date();
                const pad = (n) => (n < 10 ? `0${n}` : `${n}`);
                czasEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            }
        }, 1000);
    </script>
</body>
</html>
