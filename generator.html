<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator mDowodu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 650px; background-color: var(--card-bg); border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 28px; }
        .header h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .header p { color: var(--text-muted); font-size: 14px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }
        button { width: 100%; padding: 14px; background-color: var(--accent); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Generator mDowodu</h2>
            <p>Wprowadź dane personalne i wybierz zdjęcie</p>
        </div>
        <form id="generator-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Imię (Imiona)</label>
                    <input type="text" id="name" placeholder="np. JAN" required>
                </div>
                <div class="form-group">
                    <label for="surname">Nazwisko</label>
                    <input type="text" id="surname" placeholder="np. KOWALSKI" required>
                </div>
                <div class="form-group">
                    <label for="birthDate">Data urodzenia</label>
                    <input type="text" id="birthDate" placeholder="DD.MM.YYYY" required>
                </div>
                <div class="form-group">
                    <label for="placeOfBirth">Miejsce urodzenia</label>
                    <input type="text" id="placeOfBirth" placeholder="np. GDYNIA" required>
                </div>
                <div class="form-group">
                    <label for="gender">Płeć</label>
                    <select id="gender">
                        <option value="MĘŻCZYZNA">Mężczyzna</option>
                        <option value="KOBIETA">Kobieta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="issueDateMain">Data wydania mDowodu</label>
                    <input type="text" id="issueDateMain" placeholder="DD.MM.YYYY" required>
                </div>
                <div class="form-group">
                    <label for="fathername">Imię ojca</label>
                    <input type="text" id="fathername" placeholder="np. PIOTR">
                </div>
                <div class="form-group">
                    <label for="mothername">Imię matki</label>
                    <input type="text" id="mothername" placeholder="np. ANNA">
                </div>
                <div class="form-group">
                    <label for="addressInput">Ulica i numer</label>
                    <input type="text" id="addressInput" placeholder="np. UL. MORSKA 10/12" required>
                </div>
                <div class="form-group">
                    <label for="postalCodeInput">Kod i miejscowość</label>
                    <input type="text" id="postalCodeInput" placeholder="np. 81-001 GDYNIA" required>
                </div>
                <div class="form-group full-width">
                    <label for="photoFile">Zdjęcie profilowe (wybierz z telefonu/komputera)</label>
                    <input type="file" id="photoFile" accept="image/*">
                </div>
                <div class="form-group full-width">
                    <button type="submit">Generuj i przejdź do mDowodu</button>
                </div>
            </div>
        </form>
    </div>
    <script src="generator.js"></script>
</body>
</html>
