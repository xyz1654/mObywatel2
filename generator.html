<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator mDowodu</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0066cc; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Generator mDowodu</h2>
    <form id="generator-form">
        <div class="form-group">
            <label>Imię (Imiona)</label>
            <input type="text" id="name" placeholder="np. JAN" required>
        </div>
        <div class="form-group">
            <label>Nazwisko</label>
            <input type="text" id="surname" placeholder="np. KOWALSKI" required>
        </div>
        <div class="form-group">
            <label>Data urodzenia (DD.MM.YYYY)</label>
            <input type="text" id="birthDate" placeholder="np. 15.08.2002" required>
        </div>
        <div class="form-group">
            <label>Płeć</label>
            <select id="gender">
                <option value="MĘŻCZYZNA">Mężczyzna</option>
                <option value="KOBIETA">Kobieta</option>
            </select>
        </div>
        <div class="form-group">
            <label>Imię ojca</label>
            <input type="text" id="fathername" placeholder="np. PIOTR">
        </div>
        <div class="form-group">
            <label>Imię matki</label>
            <input type="text" id="mothername" placeholder="np. ANNA">
        </div>

        <button type="submit">Przejdź do mDowodu</button>
    </form>

    <script src="js/generator.js"></script>
</body>
</html>
