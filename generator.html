<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator mDowodu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .form-card { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { margin-bottom: 20px; text-align: center; font-size: 20px; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
        button { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Generator mDowodu</h2>
        <form id="gen-form">
            <div class="group">
                <label>Zdjęcie profilowe</label>
                <input type="file" id="photo" accept="image/*" required>
            </div>
            <div class="group">
                <label>Imię (Imiona)</label>
                <input type="text" id="name" value="OSKAR" required>
            </div>
            <div class="group">
                <label>Nazwisko</label>
                <input type="text" id="surname" value="CZERWIŃSKI" required>
            </div>
            <div class="group">
                <label>PESEL</label>
                <input type="text" id="pesel" value="08281781515" required>
            </div>
            <div class="group">
                <label>Data Urodzenia</label>
                <input type="text" id="birthDate" value="17.08.2008" required>
            </div>
            <div class="group">
                <label>Seria i Numer</label>
                <input type="text" id="idSeries" value="TCE 379079" required>
            </div>
            <button type="submit">Generuj mDowód</button>
        </form>
    </div>

    <script>
        document.getElementById("gen-form").addEventListener("submit", function (e) {
            e.preventDefault();

            // Zapis danych tekstowych
            localStorage.setItem("m_name", document.getElementById("name").value.toUpperCase());
            localStorage.setItem("m_surname", document.getElementById("surname").value.toUpperCase());
            localStorage.setItem("m_pesel", document.getElementById("pesel").value);
            localStorage.setItem("m_birthDate", document.getElementById("birthDate").value);
            localStorage.setItem("m_idSeries", document.getElementById("idSeries").value.toUpperCase());

            const fileInput = document.getElementById("photo");
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    const img = new Image();
                    img.onload = function () {
                        // Bezpieczna kompresja zdjęcia do max 400px szerokości (gwarantuje działanie na każdym telefonie)
                        const canvas = document.createElement("canvas");
                        const scale = 400 / img.width;
                        canvas.width = 400;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        // Zapis skompresowanego zdjęcia
                        const compressedData = canvas.toDataURL("image/jpeg", 0.85);
                        localStorage.setItem("m_photo", compressedData);
                        
                        // Przejście do dowodu
                        window.location.href = "dowod.html";
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                window.location.href = "dowod.html";
            }
        });
    </script>
</body>
</html>
